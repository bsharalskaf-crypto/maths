<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أستاذ حسين إبراهيم - نظام إدارة الطلاب</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #1a2a6c;
            --secondary: #fdbb2d;
            --bg-color: #f4f7f6;
            --text-color: #333;
            --white: #ffffff;
            --danger: #e74c3c;
            --success: #2ecc71;
            --light-gray: #f9f9f9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* خلفية رياضيات */
        .math-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            opacity: 0.04;
        }
        .math-symbol {
            position: absolute;
            font-size: 5rem;
            font-weight: bold;
            color: var(--primary);
            animation: float 12s infinite ease-in-out;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-40px) rotate(15deg); }
        }

        /* تسجيل الدخول */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-box {
            background: var(--white);
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            width: 400px;
        }
        .login-box h2 { color: var(--primary); margin-bottom: 20px; }
        .login-box input {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            border: 2px solid #ddd;
            border-radius: 10px;
            text-align: center;
            font-size: 1.1rem;
        }
        .login-box button {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: var(--white);
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }
        .login-box button:hover { background: var(--secondary); color: var(--primary); }

        /* الواجهة الرئيسية - بعرض الشاشة الكامل */
        .app-container { 
            display: none; 
            padding: 30px; 
            width: 100%; 
            max-width: 100%; 
        }
        
        header {
            background: var(--primary);
            color: var(--white);
            padding: 20px 40px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px rgba(26, 42, 108, 0.3);
        }
        header h1 { font-size: 1.8rem; }
        header h1 span { color: var(--secondary); }
        .logout-btn {
            background: var(--danger);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        /* إضافة طالب */
        .add-student {
            background: var(--white);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .add-student h3 { margin-bottom: 20px; color: var(--primary); }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            align-items: center;
        }
        .input-group {
            position: relative;
        }
        .input-group input {
            width: 100%;
            padding: 12px 50px 12px 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
        }
        .currency-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
            font-weight: bold;
            font-size: 0.9rem;
            pointer-events: none;
        }
        .add-btn {
            background: var(--success);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1rem;
            height: 100%;
        }

        /* البحث */
        .search-bar { margin-bottom: 20px; }
        .search-bar input {
            width: 100%;
            padding: 15px 20px;
            border-radius: 10px;
            border: 2px solid #ddd;
            font-size: 1rem;
        }

        /* الجدول */
        .table-container {
            background: var(--white);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        table { width: 100%; border-collapse: collapse; }
        thead { background: var(--primary); color: var(--white); }
        th, td { padding: 15px; text-align: center; border-bottom: 1px solid #eee; }
        th { font-weight: 700; font-size: 1.1rem; }
        tbody tr:hover { background: var(--light-gray); }
        .status-paid { color: var(--success); font-weight: bold; }
        .status-unpaid { color: var(--danger); font-weight: bold; }
        
        .manage-btn {
            background: var(--secondary);
            color: var(--primary);
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .delete-student-btn {
            background: var(--danger);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        /* النافذة المنبثقة للدفعات */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: var(--white);
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        .modal-header h3 { color: var(--primary); }
        .close-btn {
            background: transparent;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--danger);
        }
        .payment-record {
            background: var(--light-gray);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .payment-info { text-align: right; }
        .payment-info .amount { font-weight: bold; color: var(--primary); font-size: 1.2rem; }
        .payment-info .date { font-size: 0.9rem; color: #666; }
        .payment-actions button {
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 5px;
        }
        .edit-pay-btn { background: #3498db; color: white; }
        .del-pay-btn { background: var(--danger); color: white; }
        
        .add-payment-form {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            border-top: 2px solid #eee;
            padding-top: 20px;
        }
        .add-payment-form input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            flex: 1;
        }
        .add-payment-form button {
            background: var(--success);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .app-container { padding: 15px; }
            header { flex-direction: column; gap: 10px; text-align: center; padding: 15px; }
            .form-grid { grid-template-columns: 1fr; }
            th, td { font-size: 0.8rem; padding: 10px; }
            .add-btn { padding: 15px; }
        }
    </style>
</head>
<body>

    <div class="math-bg">
        <div class="math-symbol" style="top: 10%; left: 10%;">π</div>
        <div class="math-symbol" style="top: 20%; right: 15%; animation-delay: 1s;">∑</div>
        <div class="math-symbol" style="top: 50%; left: 40%; animation-delay: 2s;">√</div>
        <div class="math-symbol" style="bottom: 20%; right: 20%; animation-delay: 1.5s;">∫</div>
        <div class="math-symbol" style="bottom: 10%; left: 20%; animation-delay: 3s;">÷</div>
        <div class="math-symbol" style="top: 70%; left: 80%; animation-delay: 0.5s;">x²</div>
    </div>

    <!-- شاشة الدخول -->
    <div class="login-container" id="loginScreen">
        <div class="login-box">
            <i class="fas fa-square-root-variable fa-3x" style="color: var(--primary); margin-bottom: 20px;"></i>
            <h2>أستاذ حسين إبراهيم</h2>
            <p style="margin-bottom: 20px; color: #666;">أدخل كلمة المرور للدخول إلى النظام</p>
            <input type="password" id="passwordInput" placeholder="كلمة المرور" onkeypress="handleKeyPress(event)">
            <button onclick="login()">دخول النظام <i class="fas fa-lock"></i></button>
            <p id="error-msg" style="color: red; margin-top: 10px; display: none;">كلمة المرور غير صحيحة!</p>
        </div>
    </div>

    <!-- التطبيق الرئيسي -->
    <div class="app-container" id="appScreen">
        <header>
            <h1><i class="fas fa-user-graduate"></i> نظام إدارة طلاب: <span>أستاذ حسين إبراهيم</span></h1>
            <button class="logout-btn" onclick="logout()">تسجيل خروج <i class="fas fa-sign-out-alt"></i></button>
        </header>

        <!-- إضافة طالب -->
        <div class="add-student">
            <h3><i class="fas fa-user-plus"></i> تسجيل طالب جديد</h3>
            <div class="form-grid">
                <input type="text" id="studentName" placeholder="اسم الطالب">
                
                <div class="input-group">
                    <input type="number" id="totalAmount" placeholder="المبلغ الإجمالي المطلوب">
                    <span class="currency-icon">ل.س</span>
                </div>
                
                <div class="input-group">
                    <input type="number" id="initialPayment" placeholder="الدفعة الأولى (اختياري)">
                    <span class="currency-icon">ل.س</span>
                </div>

                <button class="add-btn" onclick="addStudent()"><i class="fas fa-save"></i> حفظ الطالب</button>
            </div>
        </div>

        <!-- البحث -->
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="🔍 ابحث باسم الطالب..." onkeyup="searchStudent()">
        </div>

        <!-- الجدول -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>م</th>
                        <th>اسم الطالب</th>
                        <th>الإجمالي</th>
                        <th>المدفوع</th>
                        <th>المتبقي</th>
                        <th>إجراءات</th>
                    </tr>
                </thead>
                <tbody id="studentsTableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- نافذة الدفعات المنبثقة -->
    <div class="modal" id="paymentModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-money-bill-wave"></i> دفعات الطالب: <span id="modalStudentName"></span></h3>
                <button class="close-btn" onclick="closeModal()"><i class="fas fa-times-circle"></i></button>
            </div>
            
            <div id="paymentsList">
                <!-- يتم عرض الدفعات هنا -->
            </div>

            <div class="add-payment-form">
                <input type="number" id="newPaymentAmount" placeholder="مبلغ الدفعة الجديدة">
                <input type="date" id="newPaymentDate">
                <button onclick="addNewPayment()"><i class="fas fa-plus"></i> إضافة دفعة</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove, update, push, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBTgyd63ljkWeXtEVPMyEM64P8CE6agorQ", // استبدلها بمفاتيحك
            authDomain: "maths-d3312.firebaseapp.com",
            databaseURL: "https://maths-d3312-default-rtdb.firebaseio.com",
            projectId: "maths-d3312",
            storageBucket: "maths-d3312.firebasestorage.app",
            messagingSenderId: "1070409201746",
            appId: "1:1070409201746:web:c67ce0cf6e7a6e9f92c78b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.db = db;
        window.ref = ref;
        window.set = set;
        window.update = update;
        window.remove = remove;
        window.push = push;
        window.child = child;

        let currentStudentId = null;

        // تحميل الطلاب
        window.loadStudents = function() {
            const studentsRef = ref(db, 'students/');
            onValue(studentsRef, (snapshot) => {
                const data = snapshot.val();
                const tableBody = document.getElementById("studentsTableBody");
                tableBody.innerHTML = "";
                
                if (data) {
                    let count = 1;
                    Object.keys(data).forEach((key) => {
                        const student = data[key];
                        
                        // حساب إجمالي المدفوع من الدفعات
                        let totalPaid = 0;
                        if (student.payments) {
                            Object.values(student.payments).forEach(p => totalPaid += parseFloat(p.amount));
                        }
                        
                        const remaining = student.total - totalPaid;
                        const status = remaining <= 0 ? 
                            `<span class="status-paid">مسدد بالكامل ✔</span>` : 
                            `<span class="status-unpaid">متبقي ${remaining} ل.س</span>`;

                        tableBody.innerHTML += `
                            <tr>
                                <td>${count++}</td>
                                <td>${student.name}</td>
                                <td>${student.total} ل.س</td>
                                <td style="color: var(--success); font-weight:bold;">${totalPaid} ل.س</td>
                                <td style="color: var(--danger); font-weight:bold;">${remaining} ل.س</td>
                                <td>
                                    <button class="manage-btn" onclick="openPaymentModal('${key}', '${student.name}')"><i class="fas fa-cog"></i> إدارة الدفعات</button>
                                    <button class="delete-student-btn" onclick="deleteStudent('${key}')"><i class="fas fa-trash"></i> حذف</button>
                                </td>
                            </tr>
                        `;
                    });
                } else {
                    tableBody.innerHTML = `<tr><td colspan="6" style="padding:30px; color:#888;">لا يوجد طلاب مسجلين حالياً</td></tr>`;
                }
            });
        }

        // فتح نافذة الدفعات
        window.openPaymentModal = function(studentId, studentName) {
            currentStudentId = studentId;
            document.getElementById("modalStudentName").innerText = studentName;
            document.getElementById("paymentModal").style.display = "flex";
            loadPayments(studentId);
        }

        window.closeModal = function() {
            document.getElementById("paymentModal").style.display = "none";
        }

        // تحميل دفعات طالب معين
        function loadPayments(studentId) {
            const paymentsRef = ref(db, 'students/' + studentId + '/payments');
            onValue(paymentsRef, (snapshot) => {
                const data = snapshot.val();
                const listDiv = document.getElementById("paymentsList");
                listDiv.innerHTML = "";

                if (data) {
                    Object.keys(data).forEach((payKey) => {
                        const payment = data[payKey];
                        listDiv.innerHTML += `
                            <div class="payment-record">
                                <div class="payment-info">
                                    <div class="amount">${payment.amount} ل.س</div>
                                    <div class="date">التاريخ: ${payment.date || 'غير محدد'}</div>
                                </div>
                                <div class="payment-actions">
                                    <button class="edit-pay-btn" onclick="editPayment('${studentId}', '${payKey}', ${payment.amount})"><i class="fas fa-edit"></i> تعديل</button>
                                    <button class="del-pay-btn" onclick="deletePayment('${studentId}', '${payKey}')"><i class="fas fa-trash"></i> حذف</button>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    listDiv.innerHTML = `<p style="text-align:center; color:#888;">لا توجد دفعات مسجلة لهذا الطالب بعد.</p>`;
                }
            });
        }

        // إضافة دفعة جديدة من النافذة
        window.addNewPayment = function() {
            const amount = parseFloat(document.getElementById("newPaymentAmount").value) || 0;
            const date = document.getElementById("newPaymentDate").value;

            if (amount <= 0) {
                alert("أدخل مبلغاً صحيحاً للدفعة");
                return;
            }

            const newPaymentRef = push(ref(db, 'students/' + currentStudentId + '/payments'));
            set(newPaymentRef, {
                amount: amount,
                date: date
            }).then(() => {
                document.getElementById("newPaymentAmount").value = "";
                document.getElementById("newPaymentDate").value = "";
            });
        }

        // تعديل دفعة
        window.editPayment = function(studentId, payKey, currentAmount) {
            const newAmount = prompt("أدخل المبلغ الصحيح للدفعة:", currentAmount);
            if (newAmount !== null && !isNaN(newAmount) && parseFloat(newAmount) >= 0) {
                update(ref(db, 'students/' + studentId + '/payments/' + payKey), {
                    amount: parseFloat(newAmount)
                });
            }
        }

        // حذف دفعة
        window.deletePayment = function(studentId, payKey) {
            if (confirm("هل تريد حذف هذه الدفعة نهائياً؟")) {
                remove(ref(db, 'students/' + studentId + '/payments/' + payKey));
            }
        }
    </script>

    <script>
        const PASSWORD = "hossein2024"; 

        function login() {
            const pass = document.getElementById("passwordInput").value;
            if (pass === PASSWORD) {
                document.getElementById("loginScreen").style.display = "none";
                document.getElementById("appScreen").style.display = "block";
                window.loadStudents();
            } else {
                document.getElementById("error-msg").style.display = "block";
            }
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") login();
        }

        function logout() {
            location.reload();
        }

        // إضافة طالب جديد (مع دفعة أولى إن وجدت)
        function addStudent() {
            const name = document.getElementById("studentName").value;
            const total = parseFloat(document.getElementById("totalAmount").value) || 0;
            const initialPay = parseFloat(document.getElementById("initialPayment").value) || 0;

            if (!name || total <= 0) {
                alert("من فضلك أدخل اسم الطالب والمبلغ الإجمالي بشكل صحيح");
                return;
            }

            const studentId = Date.now().toString();
            const studentData = {
                name: name,
                total: total
            };

            // إذا دفع الطالب دفعة أولى، نسجلها كأول دفعة له
            if (initialPay > 0) {
                studentData.payments = {
                    [Date.now().toString()]: {
                        amount: initialPay,
                        date: new Date().toISOString().split('T')[0]
                    }
                };
            }

            set(ref(window.db, 'students/' + studentId), studentData).then(() => {
                alert("تم تسجيل الطالب بنجاح!");
                document.getElementById("studentName").value = "";
                document.getElementById("totalAmount").value = "";
                document.getElementById("initialPayment").value = "";
            }).catch((error) => {
                alert("حدث خطأ: " + error);
            });
        }

        // حذف طالب بالكامل
        function deleteStudent(studentId) {
            if (confirm("هل أنت متأكد من حذف هذا الطالب وكل دفعاته؟")) {
                remove(ref(window.db, 'students/' + studentId));
            }
        }

        // البحث
        function searchStudent() {
            const filter = document.getElementById("searchInput").value.toUpperCase();
            const rows = document.querySelectorAll("#studentsTableBody tr");
            rows.forEach(row => {
                const nameCell = row.getElementsByTagName("td")[1];
                if (nameCell) {
                    const txtValue = nameCell.textContent || nameCell.innerText;
                    row.style.display = txtValue.toUpperCase().indexOf(filter) > -1 ? "" : "none";
                }
            });
        }
    </script>
</body>
</html>
